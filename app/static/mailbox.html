<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客取件 | 邮件与验证码快速接收</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="guest-body">
  <div class="guest-layout">
    <!-- Top Navigation Header -->
    <header class="guest-header">
      <div class="guest-header-left">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <div class="guest-title-wrap">
          <h1 class="guest-page-title">邮件与验证码极速取件</h1>
          <div class="guest-mailbox-pill" id="guest-mailbox-pill" title="点击复制邮箱地址">
            <span class="pill-icon">📬</span>
            <span class="pill-addr" id="guest-mailbox-addr">加载中...</span>
            <button class="btn-pill-copy" id="btn-copy-mailbox" title="复制邮箱">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="guest-header-right">
        <div class="guest-sse-badge" id="guest-sse-badge">
          <span class="live-dot pulse"></span>
          <span class="live-text">实时连接中</span>
        </div>
        <button class="btn btn-outline btn-sm" id="btn-guest-refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          刷新
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="guest-main">
      <!-- 1. Hero OTP Box (最新验证码高亮展示卡片) -->
      <section class="guest-hero-card" id="guest-hero-card">
        <div class="hero-card-inner">
          <div class="hero-left">
            <div class="hero-service-badge" id="hero-service-badge">
              <span id="hero-service-icon">⚡</span>
              <span id="hero-service-name">最新验证码</span>
            </div>
            <div class="hero-code-display">
              <span class="hero-code-val" id="hero-code-val">------</span>
            </div>
            <div class="hero-desc" id="hero-desc">
              正在监听新邮件... 邮件投递后将自动提取并高亮呈现
            </div>
          </div>
          <div class="hero-right">
            <button class="btn btn-primary btn-hero-copy" id="btn-hero-copy" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>一键复制验证码</span>
            </button>
            <div class="hero-time-tip" id="hero-time-tip"></div>
          </div>
        </div>
      </section>

      <!-- 2. Dual Panel: Mail List & Detail Viewer -->
      <div class="guest-workspace">
        <!-- Mail List Column -->
        <section class="guest-list-panel">
          <div class="guest-list-header">
            <div class="guest-list-title">
              <span>收件箱列表</span>
              <span class="badge-sm" id="guest-mail-count">0</span>
            </div>
            <div class="guest-search-wrap">
              <input type="text" id="guest-search-input" class="guest-search-input" placeholder="搜索主题/发件人...">
            </div>
          </div>
          <div class="guest-cards-container" id="guest-cards-list">
            <div class="loading-state">
              <div class="spinner"></div>
              <span>正在获取邮件...</span>
            </div>
          </div>
        </section>

        <!-- Mail Detail Column -->
        <section class="guest-detail-panel" id="guest-detail-panel">
          <div class="empty-detail-state" id="guest-empty-state">
            <div class="empty-icon">📨</div>
            <h3>请选择左侧邮件查看详情</h3>
            <p>支持完整 HTML 安全渲染、正文提取与验证码一键复制</p>
          </div>

          <div class="detail-content" id="guest-detail-content" style="display: none;">
            <div class="detail-header">
              <div class="detail-title-row">
                <h2 class="detail-subject" id="g-detail-subject">邮件主题</h2>
                <div class="detail-actions">
                  <button class="btn btn-outline btn-sm" id="btn-g-download-eml" title="下载原始 EML 报文">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    下载 EML
                  </button>
                </div>
              </div>

              <!-- Inline OTP Box in Detail -->
              <div class="otp-highlight-banner" id="g-otp-banner" style="display: none;">
                <div class="otp-banner-left">
                  <div class="otp-tag" id="g-otp-tag">Apple</div>
                  <div class="otp-value" id="g-otp-val">839210</div>
                  <div class="otp-desc" id="g-otp-snippet">本次提取的验证码</div>
                </div>
                <button class="btn btn-success" id="btn-g-copy-inline">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  复制
                </button>
              </div>

              <div class="detail-meta-grid">
                <div class="meta-row">
                  <span class="meta-label">发件人:</span>
                  <span class="meta-val highlight" id="g-detail-from"></span>
                </div>
                <div class="meta-row">
                  <span class="meta-label">收件人:</span>
                  <span class="meta-val" id="g-detail-to"></span>
                </div>
                <div class="meta-row">
                  <span class="meta-label">接收时间:</span>
                  <span class="meta-val" id="g-detail-time"></span>
                </div>
              </div>

              <!-- View Tabs -->
              <div class="detail-tabs">
                <button class="tab-btn active" data-gtab="html">HTML 预览</button>
                <button class="tab-btn" data-gtab="text">纯文本内容</button>
                <button class="tab-btn" data-gtab="otp">提取的验证码/链接</button>
                <button class="tab-btn" data-gtab="raw">Raw 报文信息</button>
              </div>
            </div>

            <!-- Tab Panels -->
            <div class="tab-panels">
              <div class="tab-panel active" id="g-panel-html">
                <iframe id="g-html-iframe" sandbox="allow-same-origin" class="html-preview-frame"></iframe>
              </div>
              <div class="tab-panel" id="g-panel-text">
                <pre class="text-preview" id="g-text-preview"></pre>
              </div>
              <div class="tab-panel" id="g-panel-otp">
                <div class="otp-table-container" id="g-otp-container"></div>
              </div>
              <div class="tab-panel" id="g-panel-raw">
                <pre class="raw-preview" id="g-raw-preview"></pre>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="/static/js/mailbox.js?v=1.0.0"></script>
</body>
</html>
